<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="robots" content="noindex, nofollow">
    <title>Página no encontrada | Centro de Convenciones Holiday Inn Durango</title>
    <meta name="description" content="La página que buscas no existe. Visita nuestra página principal para conocer nuestros servicios de salón de eventos en Durango." />
    <link rel="canonical" href="https://centrodeconvencioneshinndgo.com/" />
    <link rel="icon" type="image/png" href="images/favicon.png">
    <!-- Stylesheets -->
    <link href="css/plugins.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
            text-align: center;
            padding: 40px 20px;
        }
        .error-content {
            max-width: 600px;
        }
        .error-code {
            font-size: 150px;
            font-weight: 700;
            color: #f4b74f;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 4px 4px 0 rgba(0,0,0,0.2);
        }
        .error-title {
            font-size: 32px;
            color: #fff;
            margin-bottom: 15px;
        }
        .error-message {
            font-size: 18px;
            color: #95a5a6;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-error {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-error-primary {
            background: #f4b74f;
            color: #1a1a1a;
        }
        .btn-error-primary:hover {
            background: #c4851a;
            color: #fff;
            transform: translateY(-2px);
        }
        .btn-error-secondary {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
        }
        .btn-error-secondary:hover {
            background: #fff;
            color: #1a1a1a;
            transform: translateY(-2px);
        }
        .error-logo {
            margin-bottom: 40px;
        }
        .error-logo img {
            max-width: 200px;
            height: auto;
        }
        @media (max-width: 576px) {
            .error-code {
                font-size: 100px;
            }
            .error-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-logo">
                <a href="index.html">
                    <img src="images/logo.png" alt="Centro de Convenciones Holiday Inn Durango">
                </a>
            </div>
            <div class="error-code">404</div>
            <h1 class="error-title">¡Oops! Página no encontrada</h1>
            <p class="error-message">
                La página que buscas no existe o ha sido movida. 
                No te preocupes, puedes volver al inicio y explorar nuestros servicios para tu próximo evento.
            </p>
            <div class="error-actions">
                <a href="index.html" class="btn-error btn-error-primary">
                    <i class="fa fa-home"></i> Ir al Inicio
                </a>
                <a href="https://api.whatsapp.com/send?phone=5216181754276" target="_blank" rel="nofollow" class="btn-error btn-error-secondary">
                    <i class="fab fa-whatsapp"></i> Contactar
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/jquery.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/functions.js"></script>
</body>

</html>
